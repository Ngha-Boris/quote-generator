name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  backend-ci:
    name: Backend – Lint & Test (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quotes_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/quotes_db
      RUST_LOG: info

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting (rustfmt)
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: backend
        run: cargo test --all-features --verbose

      - name: Build release binary (smoke-check)
        working-directory: backend
        run: cargo build --release

  frontend-ci:
    name: Frontend – Lint & Test (React)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build production bundle (smoke-check)
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker – Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/quotes-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service }} image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Log image digest
        run: |
          echo "${{ matrix.service }} digest: ${{ steps.push.outputs.digest }}"
          echo "${{ matrix.service }} tags: ${{ steps.meta.outputs.tags }}"

  integration-test:
    name: Integration – Docker Compose health check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat <<'EOF' > .env
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=quotes_db
          DATABASE_URL=postgres://postgres:postgres@postgres:5432/quotes_db
          RUST_LOG=info
          EOF

      - name: Build and start all services
        run: docker compose up --build -d

      - name: Wait for backend health check
        run: |
          echo "Waiting for backend /health..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS – retrying in 5s..."
            sleep 5
          done
          echo "Backend failed to become healthy within 150s"
          docker compose logs
          exit 1

      - name: Smoke-test random quote endpoint
        run: |
          RESPONSE=$(curl -sf http://localhost/api/quotes/random)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"quote"' || (echo "Unexpected response" && exit 1)

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy – Production
    runs-on: ubuntu-latest
    needs: [docker-build, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions: {}

    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - name: Deployment summary header
        run: |
          echo "## 🚀 Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Triggered by:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to server via SSH
        id: ssh-deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          passphrase: ""
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            HEALTH_URL="${{ vars.HEALTH_CHECK_URL }}"
            MAX_RETRIES=24
            RETRY_INTERVAL=5

            : "${HEALTH_URL:=http://localhost/api/health}"

            cd "$DEPLOY_PATH"

            echo "=== Pre-deploy: snapshot current container image references ==="
            BACKEND_CID=$(docker compose ps -q backend 2>/dev/null || true)
            FRONTEND_CID=$(docker compose ps -q frontend 2>/dev/null || true)

            BACKEND_OLD_HASH=""
            BACKEND_OLD_REPO_TAG=""
            FRONTEND_OLD_HASH=""
            FRONTEND_OLD_REPO_TAG=""

            if [ -n "$BACKEND_CID" ]; then
              BACKEND_OLD_HASH=$(docker inspect --format='{{.Image}}' "$BACKEND_CID" 2>/dev/null || true)
              BACKEND_OLD_REPO_TAG=$(docker inspect --format='{{index .Config.Image}}' "$BACKEND_CID" 2>/dev/null || true)
              echo "Current backend: $BACKEND_OLD_REPO_TAG (hash: ${BACKEND_OLD_HASH:0:19}...)"
            fi

            if [ -n "$FRONTEND_CID" ]; then
              FRONTEND_OLD_HASH=$(docker inspect --format='{{.Image}}' "$FRONTEND_CID" 2>/dev/null || true)
              FRONTEND_OLD_REPO_TAG=$(docker inspect --format='{{index .Config.Image}}' "$FRONTEND_CID" 2>/dev/null || true)
              echo "Current frontend: $FRONTEND_OLD_REPO_TAG (hash: ${FRONTEND_OLD_HASH:0:19}...)"
            fi

            echo "=== Pulling latest images ==="
            docker compose pull

            echo "=== Restarting services (zero-downtime) ==="
            docker compose up -d --remove-orphans

            echo "=== Waiting for containers to stabilise ==="
            sleep 5

            echo "=== Post-deploy health check (up to $((MAX_RETRIES * RETRY_INTERVAL))s) ==="
            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "✅ Health check passed on attempt $i (HTTP $HTTP_STATUS)"
                echo "=== Pruning dangling images from previous deploys ==="
                docker image prune -f --filter "until=24h" 2>/dev/null || true
                echo "=== Deployment successful ==="
                exit 0
              fi
              echo "Attempt $i/$MAX_RETRIES: HTTP $HTTP_STATUS – retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            done

            echo "❌ Health check failed after $MAX_RETRIES attempts"
            echo "=== Initiating rollback ==="

            if [ -n "$BACKEND_OLD_HASH" ] && [ -n "$BACKEND_OLD_REPO_TAG" ]; then
              docker tag "$BACKEND_OLD_HASH" "$BACKEND_OLD_REPO_TAG" 2>/dev/null || true
              echo "Re-tagged backend: ${BACKEND_OLD_HASH:0:19}... -> $BACKEND_OLD_REPO_TAG"
            fi
            if [ -n "$FRONTEND_OLD_HASH" ] && [ -n "$FRONTEND_OLD_REPO_TAG" ]; then
              docker tag "$FRONTEND_OLD_HASH" "$FRONTEND_OLD_REPO_TAG" 2>/dev/null || true
              echo "Re-tagged frontend: ${FRONTEND_OLD_HASH:0:19}... -> $FRONTEND_OLD_REPO_TAG"
            fi

            docker compose up -d --force-recreate --remove-orphans
            echo "Rollback containers restarted with previous images"
            exit 1

      - name: Write deployment success summary
        if: success()
        run: |
          echo "### ✅ Deployment Succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | production |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ vars.DEPLOY_URL }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | Healthy ✅ |" >> "$GITHUB_STEP_SUMMARY"

      - name: Write deployment failure summary
        if: failure()
        run: |
          echo "### ❌ Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | production |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | Failed – automatic rollback attempted |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Check SSH deploy logs above. Use the **Rollback** workflow if manual intervention is needed." >> "$GITHUB_STEP_SUMMARY"
