name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1 – Lint & Test the Rust backend
  # ─────────────────────────────────────────
  backend-ci:
    name: Backend – Lint & Test (Rust)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quotes_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/quotes_db
      RUST_LOG: info

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cache compiled dependencies so subsequent runs are fast
      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting (rustfmt)
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: backend
        run: cargo test --all-features --verbose

      - name: Build release binary (smoke-check)
        working-directory: backend
        run: cargo build --release

  # ─────────────────────────────────────────
  # JOB 2 – Lint & Test the React frontend
  # ─────────────────────────────────────────
  frontend-ci:
    name: Frontend – Lint & Test (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build production bundle (smoke-check)
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────
  # JOB 3 – Build & push Docker images
  #          (only on pushes to main/develop)
  # ─────────────────────────────────────────
  docker-build:
    name: Docker – Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/quotes-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 4 – Integration test with Compose
  # ─────────────────────────────────────────
  integration-test:
    name: Integration – Docker Compose health check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat <<'EOF' > .env
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=quotes_db
          DATABASE_URL=postgres://postgres:postgres@postgres:5432/quotes_db
          RUST_LOG=info
          EOF

      - name: Build and start all services
        run: docker compose up --build -d

      - name: Wait for backend health check
        run: |
          echo "Waiting for backend /health..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS – retrying in 5s..."
            sleep 5
          done
          echo "Backend failed to become healthy within 150s"
          docker compose logs
          exit 1

      - name: Smoke-test random quote endpoint
        run: |
          RESPONSE=$(curl -sf http://localhost/api/quotes/random)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"quote"' || (echo "Unexpected response" && exit 1)

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────
  # JOB 5 – Deploy (main branch only)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy – Production
    runs-on: ubuntu-latest
    needs: [docker-build, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "Pulling latest images..."
            docker compose pull

            echo "Restarting services with zero-downtime..."
            docker compose up -d --remove-orphans

            echo "Verifying backend health..."
            for i in $(seq 1 20); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "Deployment successful!"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed after deployment!"
            exit 1

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment to production succeeded (commit: ${{ github.sha }})"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed – check the logs above"