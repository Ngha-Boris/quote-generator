<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate random motivational quotes to inspire your day. A modern DevOps showcase project.">
    <title>Quote Generator — Daily Motivation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Animated background particles -->
    <div class="bg-particles" id="bgParticles"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">✦</span>
                <h1>Quote Generator</h1>
            </div>
            <p class="tagline">Daily dose of motivation</p>
        </header>

        <!-- Main Quote Card -->
        <main class="quote-section">
            <div class="quote-card" id="quoteCard">
                <div class="quote-accent"></div>
                <div class="quote-content">
                    <div class="quote-icon">"</div>
                    <blockquote id="quoteText" class="quote-text">
                        Click the button below to generate your first quote
                    </blockquote>
                    <cite id="quoteAuthor" class="quote-author">— Waiting for inspiration</cite>
                </div>
                <div class="quote-shimmer" id="quoteShimmer"></div>
            </div>

            <!-- Action Buttons -->
            <div class="actions">
                <button id="generateBtn" class="btn btn-primary" onclick="generateQuote()">
                    <span class="btn-icon">⟳</span>
                    <span class="btn-text">Generate New Quote</span>
                </button>
                <button id="copyBtn" class="btn btn-secondary" onclick="copyQuote()" disabled>
                    <span class="btn-icon">📋</span>
                    <span class="btn-text">Copy</span>
                </button>
            </div>

            <!-- Status indicator -->
            <div class="status-bar">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">Ready</span>
            </div>
        </main>

        <!-- Quote History -->
        <section class="history-section" id="historySection" style="display: none;">
            <h2 class="section-title">
                <span class="section-icon">📖</span>
                Recent Quotes
            </h2>
            <div class="history-list" id="historyList"></div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>Built with <span class="heart">♥</span> by the team</p>
                <div class="tech-badges">
                    <span class="badge">Rust</span>
                    <span class="badge">Axum</span>
                    <span class="badge">PostgreSQL</span>
                    <span class="badge">Docker</span>
                </div>
            </div>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
