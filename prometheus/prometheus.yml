global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'quote-generator-backend'

  - job_name: 'nginx'
    metrics_path: '/nginx-health'
    static_configs:
      - targets: ['nginx:80']
        labels:
          service: 'nginx-proxy'
